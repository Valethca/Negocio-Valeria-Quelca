<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador PokeAPI</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f0f2f5; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        input { width: 80%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        button { width: 87%; padding: 10px; background-color: #ef5350; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #e53935; }
        #resultado { margin-top: 20px; text-align: left; }
        .pokemon-img { width: 150px; height: 150px; display: block; margin: 0 auto; }
        .error { color: #ef5350; font-weight: bold; text-align: center; }
        .loading { color: #777; font-style: italic; text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <h2>Buscador Pokémon</h2>
    <input type="text" id="pokeNombre" placeholder="Ej: picachu o 25..." />
    <button id="btnBuscar">Buscar</button>

    <div id="resultado"></div>
</div>

<script src="app.js"></script>
</body>
</html>
